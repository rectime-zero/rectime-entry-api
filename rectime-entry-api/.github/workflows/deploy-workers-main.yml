name: Deploy Workers Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_WORKER_MAIN: ${{ vars.CF_WORKER_MAIN }}
      CF_COMPATIBILITY_DATE: ${{ vars.CF_COMPATIBILITY_DATE }}
      CF_FIREBASE_PROJECT_ID: ${{ vars.CF_FIREBASE_PROJECT_ID }}
      CF_D1_BINDING: ${{ vars.CF_D1_BINDING }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run generate:wrangler-toml

      - run: npm run deploy -- --config wrangler.toml